<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Forty-Two Folds studio</title>
<style>
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #F3EBDC; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="124.8" step="0.0166667" value="0"><span id="tt">loading…</span></div>
</main>
<!-- engine -->
<script src="src/config.js"></script>
<script src="src/core.js"></script>
<script src="src/ink.js"></script>
<script src="src/rig.js"></script>
<script src="src/dyn.js"></script>
<script src="src/body.js"></script>
<script src="src/costume.js"></script>
<script src="src/hair.js"></script>
<!-- cast -->
<script src="src/chatgpt.js"></script>
<script src="src/claude.js"></script>
<script src="src/actor.js"></script>
<script src="src/timeline.js"></script>
<!-- reference sheets and tests (standalone loops) -->
<script src="src/sheets.js"></script>
<!-- the film: one script per scene file, in order -->
<script>
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
  boot();
</script>
</body>
</html>
